# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
name: Concerts
options:
  bundleIdPrefix: com.sanchitcop19
  deploymentTarget:
    iOS: "16.0"
targets:
  Concerts:
    type: application
    platform: iOS
    sources:
      - Concerts
    info:
      path: Concerts/Info.plist
      properties:
        CFBundleDisplayName: Concerts
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanchitcop19.stubs
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 6FBCL8RW44
