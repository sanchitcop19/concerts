# XcodeGen spec. Generate the Xcode project with:  cd ios && xcodegen
name: Concerts
options:
  bundleIdPrefix: com.sanchitcop19
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    # Shared by the app and the widget (they must match). Xcode Cloud sets the build number itself.
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 6FBCL8RW44
targets:
  Concerts:
    type: application
    platform: iOS
    sources:
      - Concerts
    dependencies:
      - target: ConcertsWidget # the home screen widget, embedded in the app
    info:
      path: Concerts/Info.plist
      properties:
        CFBundleDisplayName: Stubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        ITSAppUsesNonExemptEncryption: false
        # stubs://show/<id> links from the widget open that concert
        CFBundleURLTypes:
          - CFBundleURLName: com.sanchitcop19.stubs
            CFBundleURLSchemes: [stubs]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanchitcop19.stubs
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  ConcertsWidget:
    type: app-extension
    platform: iOS
    sources:
      - ConcertsWidget
    info:
      path: ConcertsWidget/Info.plist
      properties:
        CFBundleDisplayName: Stubs
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sanchitcop19.stubs.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
