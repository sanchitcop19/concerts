<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Concert Archive</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f7f6f3;--card:#fff;--ink:#1d1b20;--muted:#6b6670;--line:#e6e2dc;
  --accent:#6d4ae0;--accent-soft:#e9e3fc;--warn-bg:#fff4d6;--warn-ink:#6b4e00;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141317;--card:#1e1c22;--ink:#f1eef5;--muted:#a49dab;--line:#2f2c35;
    --accent:#a58bff;--accent-soft:#2c2540;--warn-bg:#3a3020;--warn-ink:#f3d58a;
  }
}
:root[data-theme="dark"]{
  --bg:#141317;--card:#1e1c22;--ink:#f1eef5;--muted:#a49dab;--line:#2f2c35;
  --accent:#a58bff;--accent-soft:#2c2540;--warn-bg:#3a3020;--warn-ink:#f3d58a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:20px}
h1{margin:0;font-size:28px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px}
.controls{display:flex;gap:8px;flex-wrap:wrap}
select,input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
.banner{background:var(--warn-bg);color:var(--warn-ink);padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi,.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.vbars{display:flex;align-items:flex-end;gap:4px;height:160px}
.vbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;cursor:default}
.vbar .b{width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
.vbar .n{font-size:11px;color:var(--muted);margin-bottom:3px;font-variant-numeric:tabular-nums}
.vbar .x{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
.vbar.click{cursor:pointer}.vbar.click:hover .b{opacity:.8}
.hbars{display:flex;flex-direction:column;gap:6px}
.hrow{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 28px;gap:8px;align-items:center;font-size:13px}
.hrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .track{background:var(--accent-soft);border-radius:4px;height:12px}
.hrow .fill{background:var(--accent);height:100%;border-radius:4px}
.hrow .c{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em}
td.d{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.tablewrap{overflow-x:auto}
tr.off td{opacity:.55}
.status{font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.tag{display:inline-block;background:var(--accent-soft);color:var(--ink);border-radius:999px;padding:1px 8px;margin:1px 2px 1px 0;font-size:12px}
footer{margin-top:24px;color:var(--muted);font-size:12px}
a{color:var(--accent)}
@media (max-width:600px){.hide-sm{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>🎸 My Concert Archive</h1>
      <div class="sub" id="sub">Loading…</div>
    </div>
    <div class="controls">
      <select id="year" aria-label="Filter by year"><option value="">All years</option></select>
      <input id="q" type="search" placeholder="Search band, venue, city…" aria-label="Search">
    </div>
  </header>
  <div id="banner"></div>
  <div id="upcoming"></div>
  <section class="kpis" id="kpis"></section>
  <section class="grid">
    <div class="card" style="grid-column:1/-1"><h2>Shows per year</h2><div id="byYear"></div></div>
  </section>
  <section class="grid">
    <div class="card"><h2>By month</h2><div id="byMonth"></div></div>
    <div class="card"><h2>By day of week</h2><div id="byDow"></div></div>
  </section>
  <section class="grid">
    <div class="card"><h2>Most-seen artists</h2><div id="topArtists"></div></div>
    <div class="card"><h2>Top venues</h2><div id="topVenues"></div></div>
    <div class="card"><h2>Top cities</h2><div id="topCities"></div></div>
  </section>
  <section class="card">
    <h2 id="listTitle">All shows</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>Date</th><th>Artists</th><th>Venue</th><th class="hide-sm">City</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
  </section>
  <footer id="foot"></footer>
</div>
<script>
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOWS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONTH_IDX=Object.fromEntries(["january","february","march","april","may","june","july","august","september","october","november","december"].map((m,i)=>[m.slice(0,3),i]));
const $=id=>document.getElementById(id);
const TODAY=new Date().toISOString().slice(0,10);
const attended=c=>c.status==="past"||c.status==="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// ---- Column detection: works with whatever headers the Concert Archives export uses ----
function pickColumns(headers){
  const find=(re,not)=>headers.find(h=>re.test(h)&&!(not&&not.test(h)));
  return {
    date:find(/date/i),
    bands:find(/band|artist|performer|lineup|act/i),
    title:find(/concert name|event name|^title$/i)||find(/concert|event|title|name|tour/i,/band|artist|venue|city|type|status|date|url/i),
    status:find(/status/i),
    venue:find(/venue/i),
    city:find(/city|town/i),
    state:find(/state|region|province/i),
    country:find(/country/i),
    location:find(/location|place|address/i),
  };
}
function parseDate(s){
  s=String(s||"").trim(); if(!s) return null; let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return mk(+m[1],+m[2]-1,+m[3]);
  if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/))) return mk(fixY(+m[3]),+m[1]-1,+m[2]);
  if((m=s.match(/([A-Za-z]{3})[a-z]*\.?\s+(\d{1,2}),?\s+(\d{4})/))&&m[1].toLowerCase() in MONTH_IDX) return mk(+m[3],MONTH_IDX[m[1].toLowerCase()],+m[2]);
  if((m=s.match(/(\d{1,2})\s+([A-Za-z]{3})[a-z]*\.?,?\s+(\d{4})/))&&m[2].toLowerCase() in MONTH_IDX) return mk(+m[3],MONTH_IDX[m[2].toLowerCase()],+m[1]);
  if((m=s.match(/^(\d{4})$/))) return {y:+m[1],m:null,d:null,dow:null,key:m[1]+"-00-00"};
  return null;
}
function fixY(y){return y<100?(y>50?1900+y:2000+y):y}
function mk(y,mo,d){const dt=new Date(Date.UTC(y,mo,d));return {y,m:mo,d,dow:dt.getUTCDay(),key:`${y}-${String(mo+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`}}
function splitBands(s,header){
  s=String(s||"").trim(); if(!s) return [];
  // Concert Archives uses " / " between bands. Never split on commas: "Tyler, The Creator" is one act.
  const parts=s.split(/\s+\/\s+|\s*[;|\n]\s*/);
  return [...new Set(parts.map(p=>p.trim()).filter(Boolean))];
}
function normalize(rows,cols){
  return rows.map(r=>{
    const date=parseDate(r[cols.date]);
    let city=(r[cols.city]||"").trim();
    let state=(r[cols.state]||"").trim(), country=(r[cols.country]||"").trim();
    // A single "Location" column like "San Francisco, CA, United States"
    if(!city&&cols.location){const p=(r[cols.location]||"").split(",").map(x=>x.trim());city=p[0]||"";state=state||p[1]||"";}
    const bands=splitBands(r[cols.bands],cols.bands);
    const title=(r[cols.title]||"").trim();
    // Status: Past / Upcoming / Cancelled / Rescheduled. Without a column, future dates count as upcoming.
    let status=(r[cols.status]||"").trim().toLowerCase();
    if(!status) status=date&&date.key>TODAY?"upcoming":"past";
    return {date,status,bands:bands.length?bands:(title?[title]:[]),title,venue:(r[cols.venue]||"").trim(),
      city,place:[city,state||country].filter(Boolean).join(", ")};
  }).filter(c=>c.date||c.bands.length);
}

// ---- Rendering helpers ----
const count=(arr,f)=>{const m=new Map();for(const x of arr)for(const k of [].concat(f(x)))if(k)m.set(k,(m.get(k)||0)+1);return m};
function vbars(el,labels,values,onClick){
  const max=Math.max(1,...values);
  el.innerHTML=`<div class="vbars">${labels.map((l,i)=>`<div class="vbar${onClick?" click":""}" data-i="${i}" title="${esc(l)}: ${values[i]}"><div class="n">${values[i]||""}</div><div class="b" style="height:${values[i]/max*100}%"></div><div class="x">${esc(l)}</div></div>`).join("")}</div>`;
  if(onClick) el.querySelectorAll(".vbar").forEach(b=>b.onclick=()=>onClick(labels[+b.dataset.i]));
}
function hbars(el,map,n=10,onClick){
  const top=[...map].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,n);
  if(!top.length){el.innerHTML='<div class="empty">Nothing here yet.</div>';return}
  const max=top[0][1];
  el.innerHTML=`<div class="hbars">${top.map(([k,v])=>`<div class="hrow" title="${esc(k)}: ${v}"><span class="name">${onClick?`<a href="#" data-k="${esc(k)}">${esc(k)}</a>`:esc(k)}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span class="c">${v}</span></div>`).join("")}</div>`;
  if(onClick) el.querySelectorAll("a[data-k]").forEach(a=>a.onclick=e=>{e.preventDefault();onClick(a.dataset.k)});
}
function fmtDate(d){return !d?"—":d.m==null?String(d.y):`${MONTHS[d.m]} ${d.d}, ${d.y}`}

let ALL=[];
function render(){
  const yr=$("year").value, q=$("q").value.trim().toLowerCase();
  const matches=ALL.filter(c=>(!yr||(c.date&&String(c.date.y)===yr))&&(!q||[c.title,c.venue,c.place,...c.bands].join(" ").toLowerCase().includes(q)));
  const list=matches.filter(attended); // stats only count shows you actually went to
  const upcoming=ALL.filter(c=>c.status==="upcoming").sort((a,b)=>(a.date?.key||"").localeCompare(b.date?.key||""));
  $("upcoming").innerHTML=upcoming.length?`<div class="card" style="margin-bottom:16px"><h2>Coming up</h2>${upcoming.map(c=>`<div style="margin:4px 0"><b>${fmtDate(c.date)}</b> · ${c.bands.map(b=>`<span class="tag">${esc(b)}</span>`).join("")} <span class="sub">${esc([c.venue,c.place].filter(Boolean).join(", "))}</span></div>`).join("")}</div>`:"";
  const artists=count(list,c=>c.bands), venues=count(list,c=>c.venue), cities=count(list,c=>c.place);
  const dated=list.filter(c=>c.date).sort((a,b)=>a.date.key.localeCompare(b.date.key));
  const years=count(dated,c=>String(c.date.y));
  const topYear=[...years].sort((a,b)=>b[1]-a[1])[0];
  const topArtist=[...artists].sort((a,b)=>b[1]-a[1])[0];
  const kpi=(l,v,s="")=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${esc(s)}</div></div>`;
  $("kpis").innerHTML=
    kpi("Shows",list.length,dated.length?`${fmtDate(dated[0].date)} → ${fmtDate(dated.at(-1).date)}`:"")+
    kpi("Artists",artists.size,topArtist?`Most seen: ${topArtist[0]} (${topArtist[1]}×)`:"")+
    kpi("Venues",venues.size)+
    kpi("Cities",cities.size)+
    kpi("Busiest year",topYear?topYear[0]:"—",topYear?`${topYear[1]} shows`:"");

  // Shows per year — always use full timeline so gaps show as zero
  const allYears=ALL.filter(c=>c.date&&attended(c)).map(c=>c.date.y);
  if(allYears.length){
    const lo=Math.min(...allYears),hi=Math.max(...allYears),ys=[];for(let y=lo;y<=hi;y++)ys.push(String(y));
    vbars($("byYear"),ys,ys.map(y=>years.get(y)||0),y=>{$("year").value=$("year").value===y?"":y;render()});
  } else $("byYear").innerHTML='<div class="empty">No dates found.</div>';
  const withM=dated.filter(c=>c.date.m!=null);
  vbars($("byMonth"),MONTHS,MONTHS.map((_,i)=>withM.filter(c=>c.date.m===i).length));
  vbars($("byDow"),DOWS,DOWS.map((_,i)=>withM.filter(c=>c.date.dow===i).length));
  const searchFor=k=>{$("q").value=k;render()};
  hbars($("topArtists"),artists,10,searchFor);
  hbars($("topVenues"),venues,10,searchFor);
  hbars($("topCities"),cities,10,searchFor);

  const skipped=matches.length-list.length;
  $("listTitle").textContent=`${yr||q?"Matching":"All"} shows (${list.length}${skipped?` + ${skipped} upcoming/cancelled`:""})`;
  $("rows").innerHTML=[...matches].sort((a,b)=>(b.date?.key||"").localeCompare(a.date?.key||"")).map(c=>
    `<tr${attended(c)?"":' class="off"'}><td class="d">${fmtDate(c.date)}${attended(c)?"":`<div class="status">${esc(c.status)}</div>`}</td><td>${c.title&&!c.bands.includes(c.title)?`<div class="sub">${esc(c.title)}</div>`:""}${c.bands.map(b=>`<span class="tag">${esc(b)}</span>`).join("")}</td><td>${esc(c.venue)}</td><td class="hide-sm">${esc(c.place)}</td></tr>`
  ).join("")||'<tr><td colspan="4" class="empty">No shows match.</td></tr>';
}

async function load(){
  // Your real export wins (CSV or Excel); otherwise fall back to the sample.
  let src=null, text=null;
  for(const f of ["data/concerts.csv","data/concerts.xlsx","data/sample.csv"]){
    try{const r=await fetch(f,{cache:"no-store"});if(!r.ok)continue;src=f;
      if(f.endsWith(".xlsx")){const wb=XLSX.read(await r.arrayBuffer(),{type:"array",cellDates:false,raw:false});text=XLSX.utils.sheet_to_csv(wb.Sheets[wb.SheetNames[0]],{rawNumbers:false})}
      else text=await r.text();
      break}catch(e){}
  }
  if(text==null){$("sub").textContent="No data file found. Add data/concerts.csv.";return}
  const parsed=Papa.parse(text.replace(/^\uFEFF/,""),{header:true,skipEmptyLines:true});
  const cols=pickColumns(parsed.meta.fields||[]);
  ALL=normalize(parsed.data,cols);
  if(src.endsWith("sample.csv")) $("banner").innerHTML='<div class="banner">👋 Showing <b>sample data</b>. Add your Concert Archives export as <code>data/concerts.csv</code> to see your real shows.</div>';
  const ys=[...new Set(ALL.filter(c=>c.date).map(c=>c.date.y))].sort((a,b)=>b-a);
  $("year").insertAdjacentHTML("beforeend",ys.map(y=>`<option>${y}</option>`).join(""));
  $("sub").textContent=`${ALL.filter(attended).length} shows · source: ${src}`;
  const missing=Object.entries(cols).filter(([k,v])=>!v&&["date","bands","venue"].includes(k)).map(([k])=>k);
  $("foot").innerHTML=`Detected columns: ${Object.entries(cols).filter(([,v])=>v).map(([k,v])=>`${k} → “${esc(v)}”`).join(", ")}${missing.length?` · <b>Couldn’t find: ${missing.join(", ")}</b>`:""}`;
  $("year").onchange=render; $("q").oninput=render;
  render();
}
load();
</script>
</body>
</html>
