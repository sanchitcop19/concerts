# Publishes the dashboard to GitHub Pages every time anything is pushed to master
# (e.g. a new data/concerts.csv from the Gmail sync script or a manual upload).
name: Deploy dashboard

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *" # daily, so show times Ticketmaster adds later get picked up

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp index.html manifest.webmanifest _site/
          cp -r icons _site/
          cp data/* _site/data/
          if [ -f data/concerts.csv ]; then
            # Start/doors times for upcoming shows (skipped if the secret isn't set)
            python3 scripts/lookup_times.py data/concerts.csv _site/data/times.json
            # Small summary for the iPhone home screen widget
            python3 scripts/build_widget_json.py data/concerts.csv _site/data/widget.json _site/data/times.json
          fi
        env:
          # Either secret name works
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY || secrets.TICKETMASTER_KEY }}
          # Last published times, so shows that already happened keep theirs
          PREVIOUS_TIMES_URL: https://sanchitcop19.github.io/concerts/data/times.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
