# Publishes the dashboard to GitHub Pages every time anything is pushed to master
# (e.g. a new data/concerts.csv from the Gmail sync script or a manual upload).
name: Deploy dashboard

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: |
          mkdir -p _site/data
          cp index.html manifest.webmanifest _site/
          cp -r icons _site/
          cp data/* _site/data/
          # Small summary for the iPhone home screen widget
          if [ -f data/concerts.csv ]; then python3 scripts/build_widget_json.py data/concerts.csv _site/data/widget.json; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
